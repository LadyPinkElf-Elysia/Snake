<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蔚蓝档案贪吃蛇 横屏版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
html,body{
    width:100%;
    height:100%;
}
body{
    background:#2b2b2b;
    color:#fff;
    text-align:center;
    font-family:微软雅黑;
    overflow:hidden;
}

#game{
    border:2px solid #4CAF50;
    background:#000;
    width:70vh;
    height:70vh;
    max-width:90vw;
    max-height:90vw;
}

.info{
    margin-bottom:8px;
    font-size:16px;
}

.menu{
    margin:15px 0;
}

button{
    padding:8px 16px;
    margin:4px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    touch-action:manipulation;
}

.normal{background:#4CAF50;color:white}
.hard{background:#ff9800;color:white}
.hell{background:#f44336;color:white}
.peace{background:#8bc34a;color:white}
.challenge{background:#00bcd4;color:white}
.restart{background:#2196F3}
.back{background:#9e9e9e}
.shop{background:#9c27b0;color:white;margin-top:8px}
.prop{background:#673ab7;margin:3px}
.skin-btn{background:#e91e63;color:white;margin:5px}

.game-layout{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    height:calc(100vh - 60px);
}

.left-panel, .right-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.joystick-area{
    position:relative;
    width:150px;
    height:150px;
}

.joystick-bg{
    width:150px;
    height:150px;
    border-radius:50%;
    background:#333;
    border:2px solid #555;
}

.joystick-thumb{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#00bcd4;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    touch-action:none;
}

.speed-btn{
    width:64px;
    height:64px;
    background:#ff5722;
    color:white;
    border-radius:10px;
    font-size:14px;
    border:none;
}

.prop-bar{
    display:flex;
    gap:6px;
    justify-content:center;
}

.prop-item{
    padding:6px 10px;
    background:#444;
    border-radius:6px;
    font-size:14px;
}

.color-select{
    margin:10px 0;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.color-item{
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid #fff;
    opacity:0.7;
}

.color-item.active{
    opacity:1;
    transform:scale(1.1);
}

.skin-panel{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#333;
    padding:20px;
    border-radius:12px;
    z-index:999;
}

.countdown{
    font-size:22px;
    color:#ffeb3b;
    font-weight:bold;
    margin:10px 0;
}

.death-panel{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1a1a1a;
    padding:25px;
    border-radius:12px;
    z-index:1000;
    border:2px solid #f44336;
}

.death-title{
    font-size:24px;
    color:#f44336;
    margin-bottom:20px;
    font-weight:bold;
}

.death-btn-group{
    display:flex;
    gap:20px;
    justify-content:center;
}

.menu#endMenu{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1a1a1a;
    padding:25px;
    border-radius:12px;
    border:2px solid #2196F3;
    z-index:1000;
    display:none;
}
</style>
</head>
<body>

<div class="menu" id="mainMenu">
    <h2>选择难度</h2>
    <button class="normal" onclick="startGame('normal')">普通</button>
    <button class="hard" onclick="startGame('hard')">困难</button>
    <button class="hell" onclick="startGame('hell')">炼狱</button>
    <button class="peace" onclick="startGame('peace')">和平模式</button>
    <button class="challenge" onclick="startChallenge()">一分钟挑战模式</button>

    <div style="margin-top:15px">
        <h3>道具&皮肤商店</h3>
        <button class="prop" onclick="buyProp('shield')">护盾（10积分）：5秒免疫碰撞</button>
        <button class="prop" onclick="buyProp('lucky')">幸运药水（15积分）：提升幸运概率</button>
        <button class="skin-btn" onclick="buySkin()">女仆爱丽丝皮肤（30积分）</button>
        <p>当前积分：<span id="point">0</span></p>
        <p id="skinStatus">皮肤状态：未解锁</p>
    </div>

    <div>
        <h3>选择蛇身颜色（不可选紫色）</h3>
        <div class="color-select" id="colorSelect">
            <div class="color-item active" style="background:#4CAF50" data-color="#4CAF50" onclick="selectColor('#4CAF50')"></div>
            <div class="color-item" style="background:#ff5722" data-color="#ff5722" onclick="selectColor('#ff5722')"></div>
            <div class="color-item" style="background:#0099ff" data-color="#0099ff" onclick="selectColor('#0099ff')"></div>
            <div class="color-item" style="background:#ffeb3b" data-color="#ffeb3b" onclick="selectColor('#ffeb3b')"></div>
            <div class="color-item" style="background:#00e5ff" data-color="#00e5ff" onclick="selectColor('#00e5ff')"></div>
            <div class="color-item" style="background:#ffffff" data-color="#ffffff" onclick="selectColor('#ffffff')"></div>
            <div class="color-item" style="background:#888888" data-color="#888888" onclick="selectColor('#888888')"></div>
        </div>
    </div>
</div>

<div class="info" id="gameInfo" style="display:none">
    分数：<span id="score">0</span> | 积分：<span id="gamePoint">0</span>
    <div class="countdown" id="countdown" style="display:none">剩余时间：<span id="timeLeft">60</span>秒</div>
</div>

<div class="game-layout" id="gameLayout" style="display:none">
    <div class="left-panel">
        <div class="prop-bar">
            <div class="prop-item" id="shieldProp">护盾:0</div>
            <div class="prop-item" id="doubleProp">双倍积分:关闭</div>
        </div>

        <div class="joystick-area" id="joystick">
            <div class="joystick-bg"></div>
            <div class="joystick-thumb" id="thumb"></div>
        </div>

        <button class="speed-btn" id="speedBtn">加速</button>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="right-panel">
        <p>键盘方向键控制</p>
        <p>空格键击杀AI蛇</p>
    </div>
</div>

<div class="menu" id="endMenu">
    <h3>游戏结束</h3>
    <button class="restart" onclick="restartGame()">重新开始</button>
    <button class="back" onclick="backToMenu()">回到主界面</button>
</div>

<div class="death-panel" id="deathPanel">
    <div class="death-title">你已死亡</div>
    <div class="death-btn-group">
        <button class="restart" onclick="restartGame()">重新开始</button>
        <button class="back" onclick="backToMenu()">返回界面</button>
    </div>
</div>

<div class="skin-panel" id="skinUnlockPanel">
    <h3>恭喜！挑战成功</h3>
    <p>已解锁女仆爱丽丝皮肤</p>
    <button onclick="closeSkinPanel()">确定</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const pointDom = document.getElementById('point');
const gamePointDom = document.getElementById('gamePoint');
const mainMenu = document.getElementById('mainMenu');
const gameInfo = document.getElementById('gameInfo');
const gameCanvas = document.getElementById('game');
const gameLayout = document.getElementById('gameLayout');
const endMenu = document.getElementById('endMenu');
const joystick = document.getElementById('joystick');
const thumb = document.getElementById('thumb');
const speedBtn = document.getElementById('speedBtn');
const shieldPropDom = document.getElementById('shieldProp');
const doublePropDom = document.getElementById('doubleProp');
const countdownDom = document.getElementById('countdown');
const timeLeftDom = document.getElementById('timeLeft');
const skinStatusDom = document.getElementById('skinStatus');
const skinUnlockPanel = document.getElementById('skinUnlockPanel');
const deathPanel = document.getElementById('deathPanel');
const colorSelect = document.getElementById('colorSelect');

const size = 20;
const maxGrid = 20;

let playerSnake = [{x:10,y:10}];
let dir = 'right';
let nextDir = 'right';
let score = 0;
let gamePoint = 0;
let aiSnake = [{x:3,y:3}];
let aiDir = 'right';
let food = {};
let timer;
let difficulty = '';
let isChallengeMode = false;
let challengeTime = 60;
let challengeTimer = null;
let skinUnlocked = false;
let currentSkin = 'default';
let playerColor = '#4CAF50';

let shieldTime = 0;
let luckyBuff = false;
let speedBoosting = false;
let doublePoint = false;
let worldProps = [];
const propTypes = ['shield','speed','double'];
const foodTypes = ['red','blue','colorful','gray'];

let isDragging = false;
const joystickRadius = 75;
const thumbRadius = 24;

let speedFactor = 0;
let gameRunTime = 0;
let speedTimer = null;

function selectColor(color){
    playerColor = color;
    document.querySelectorAll('.color-item').forEach(item=>{
        item.classList.remove('active');
    });
    document.querySelector(`[data-color="${color}"]`).classList.add('active');
}

function getDifficultyConfig(){
    let baseSpeed = 220;
    switch(difficulty){
        case 'normal':
            return {speed: baseSpeed * 1.5, aiAttack: false};
        case 'hard':
            return {speed: baseSpeed * 1.25, aiAttack: false};
        case 'hell':
            return {speed: baseSpeed * 0.75, aiAttack: true};
        case 'peace':
            return {speed: baseSpeed * 1.5, aiAttack: false, noDeathHeadHit:true};
    }
}

function startSpeedTimer(){
    speedTimer = setInterval(()=>{
        gameRunTime++;
        if(difficulty === 'normal' || difficulty === 'peace'){
            if(gameRunTime % 60 === 0){
                speedFactor += 0.001;
            }
        }else if(difficulty === 'hard'){
            if(gameRunTime % 120 === 0){
                speedFactor += 0.01;
            }
        }
    },1000);
}

function genFood(){
    let x,y;
    do{
        x = Math.floor(Math.random() * maxGrid);
        y = Math.floor(Math.random() * maxGrid);
    }while(
        playerSnake.some(p=>p.x===x&&p.y===y) ||
        aiSnake.some(p=>p.x===x&&p.y===y) ||
        worldProps.some(p=>p.x===x&&p.y===y)
    );
    let r = Math.random() * 100;
    let type;
    if(r < 25) type = 'red';
    else if(r < 90) type = 'blue';
    else if(r < 98) type = 'gray';
    else type = 'colorful';
    food = {x,y,type};
}

function genWorldProp(){
    if(Math.random()>0.3) return;
    let x,y;
    do{
        x = Math.floor(Math.random() * maxGrid);
        y = Math.floor(Math.random() * maxGrid);
    }while(
        playerSnake.some(p=>p.x===x&&p.y===y) ||
        aiSnake.some(p=>p.x===x&&p.y===y) ||
        worldProps.some(p=>p.x===x&&p.y===y) ||
        (food.x===x&&food.y===y)
    );
    let type = propTypes[Math.floor(Math.random()*propTypes.length)];
    worldProps.push({x,y,type});
}

function aiHitPlayerBody(){
    aiSnake.forEach(seg=>{
        worldProps.push({x:seg.x,y:seg.y,type:'gray'});
    });
    aiSnake = [{x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}];
    gamePoint += 5;
    gamePointDom.innerText=gamePoint;
    pointDom.innerText=gamePoint;
}

function headCollision(){
    const cfg = getDifficultyConfig();
    if(cfg.noDeathHeadHit) return;
    let r = Math.random();
    if(r < 0.5){
        clearInterval(timer);clearInterval(challengeTimer);clearInterval(speedTimer);
        gameCanvas.style.display='none';
        joystick.style.display='none';
        speedBtn.style.display='none';
        deathPanel.style.display='block';
    }else{
        aiHitPlayerBody();
    }
}

function collisionRandomEvent(){
    const cfg = getDifficultyConfig();
    if(cfg.noDeathHeadHit) return;
    if(shieldTime > 0){
        shieldTime--;
        updatePropUI();
        return;
    }
    let r = Math.random() * 100;
    let dieRate = 50, halfRate=25, headRate=30, safeRate=5;
    if(luckyBuff){
        safeRate *= 1.5;halfRate *=1.5;headRate *=1.5;
        dieRate = 100 - safeRate - halfRate - headRate;
    }
    if(r < safeRate) return;
    else if(r < safeRate+halfRate) playerSnake = playerSnake.slice(0, Math.max(1, Math.floor(playerSnake.length/2)));
    else if(r < safeRate+halfRate+headRate) playerSnake = [playerSnake[0]];
    else{
        clearInterval(timer);clearInterval(challengeTimer);clearInterval(speedTimer);
        gameCanvas.style.display='none';
        joystick.style.display='none';
        speedBtn.style.display='none';
        deathPanel.style.display='block';
    }
}

function checkAiCollision(){
    let pHead = playerSnake[0];
    let aHead = aiSnake[0];
    if(pHead.x === aHead.x && pHead.y === aHead.y){
        headCollision();
        return true;
    }
    let hitBody = playerSnake.slice(1).some(p=>p.x===aHead.x&&p.y===aHead.y);
    if(hitBody){
        aiHitPlayerBody();
        return true;
    }
    return false;
}

function checkPropPick(){
    let head = playerSnake[0];
    for(let i=0;i<worldProps.length;i++){
        let p = worldProps[i];
        if(p.x===head.x&&p.y===head.y){
            playerSnake.push(playerSnake.at(-1));
            switch(p.type){
                case 'shield': shieldTime=5;break;
                case 'speed': speedBoosting=true;setTimeout(()=>speedBoosting=false,3000);break;
                case 'double': doublePoint=true;setTimeout(()=>doublePoint=false,5000);break;
            }
            worldProps.splice(i,1);updatePropUI();return;
        }
    }
}

function aiMove(){
    let head = {...aiSnake[0]};
    const cfg = getDifficultyConfig();
    if(cfg.aiAttack){
        if(playerSnake[0].x>head.x) aiDir='right';
        else if(playerSnake[0].x<head.x) aiDir='left';
        else if(playerSnake[0].y>head.y) aiDir='down';
        else if(playerSnake[0].y<head.y) aiDir='up';
    }else{
        if(food.x>head.x) aiDir='right';
        else if(food.x<head.x) aiDir='left';
        else if(food.y>head.y) aiDir='down';
        else if(food.y<head.y) aiDir='up';
    }
    switch(aiDir){
        case 'up': head.y--;break;case 'down':head.y++;break;
        case 'left':head.x--;break;case 'right':head.x++;break;
    }
    if(head.x<0) head.x=maxGrid-1;if(head.x>=maxGrid) head.x=0;
    if(head.y<0) head.y=maxGrid-1;if(head.y>=maxGrid) head.y=0;
    aiSnake.unshift(head);
    if(head.x===food.x&&head.y===food.y){genFood();genWorldProp();}else aiSnake.pop();
}

function playerMove(){
    dir = nextDir;
    let head = {...playerSnake[0]};
    switch(dir){
        case 'up':head.y--;break;case 'down':head.y++;break;
        case 'left':head.x--;break;case 'right':head.x++;break;
    }
    //全部模式撞墙直接死亡，和平模式不再穿墙
    if(head.x<0||head.x>=maxGrid||head.y<0||head.y>=maxGrid){
        clearInterval(timer);clearInterval(challengeTimer);clearInterval(speedTimer);
        gameCanvas.style.display='none';
        joystick.style.display='none';
        speedBtn.style.display='none';
        deathPanel.style.display='block';
        return;
    }
    playerSnake.unshift(head);
    checkAiCollision();
    checkPropPick();
    if(head.x===food.x&&head.y===food.y){
        let add = 1;if(doublePoint) add*=2;score+=add;scoreDom.innerText=score;
        let growNum=0;
        if(food.type==='red') growNum=1;
        else if(food.type==='blue') growNum=2;
        else if(food.type==='gray') growNum=3;
        else if(food.type==='colorful'){
            growNum=1;
            let randProp = propTypes[Math.floor(Math.random()*propTypes.length)];
            switch(randProp){
                case 'shield':shieldTime=5;break;
                case 'speed':speedBoosting=true;setTimeout(()=>speedBoosting=false,3000);break;
                case 'double':doublePoint=true;setTimeout(()=>doublePoint=false,5000);break;
            }
        }
        for(let i=0;i<growNum;i++) playerSnake.push(playerSnake.at(-1));
        updatePropUI();genFood();genWorldProp();
        if(isChallengeMode&&gamePoint>=50&&!skinUnlocked){
            skinUnlocked=true;currentSkin='maid';skinStatusDom.innerText="皮肤状态：已解锁（女仆爱丽丝）";
            skinUnlockPanel.style.display='block';
        }
    }else playerSnake.pop();
}

function killAiGetPoint(){
    let base = aiSnake.length+1;let mul=1;
    if(difficulty==='hard') mul=1.5;
    if(difficulty==='hell'){base=(aiSnake.length+1)*2;if(base>40)base*=0.85;}
    let add = Math.floor(base*mul*(doublePoint?2:1));
    gamePoint+=add;gamePointDom.innerText=gamePoint;pointDom.innerText=gamePoint;
    aiSnake = [{x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}];
}

function draw(){
    if(difficulty==='hell'){
        let grad = ctx.createLinearGradient(0,0,400,400);
        grad.addColorStop(0,'#0a192f');grad.addColorStop(0.5,'#102a43');grad.addColorStop(1,'#000');
        ctx.fillStyle=grad;
    }else ctx.fillStyle='#000';
    ctx.fillRect(0,0,400,400);

    if(currentSkin === 'maid') ctx.fillStyle='#00e5ff';
    else ctx.fillStyle = playerColor;
    playerSnake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-1,size-1));

    ctx.fillStyle='#c044ff';
    aiSnake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-1,size-1));

    if(food.type==='red') ctx.fillStyle='#ff5722';
    else if(food.type==='blue') ctx.fillStyle='#0099ff';
    else if(food.type==='gray') ctx.fillStyle='#888888';
    else if(food.type==='colorful') ctx.fillStyle='#ff00ff';
    ctx.fillRect(food.x*size,food.y*size,size-1,size-1);

    worldProps.forEach(p=>{
        switch(p.type){
            case 'shield':ctx.fillStyle='#00bcd4';break;
            case 'speed':ctx.fillStyle='#ffeb3b';break;
            case 'double':ctx.fillStyle='#9c27b0';break;
        }
        ctx.fillRect(p.x*size,p.y*size,size-1,size-1);
    })
}

function updatePropUI(){
    shieldPropDom.innerText=`护盾:${shieldTime}`;
    doublePropDom.innerText=doublePoint?'双倍积分:开启':'双倍积分:关闭';
}

thumb.addEventListener('touchstart',e=>{e.preventDefault();isDragging=true;})
document.addEventListener('touchmove',e=>{
    if(!isDragging)return;e.preventDefault();
    const rect=joystick.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const tx=e.touches[0].clientX,ty=e.touches[0].clientY;
    let dx=tx-cx,dy=ty-cy;
    const dist=Math.hypot(dx,dy);
    if(dist>joystickRadius-thumbRadius){
        const s=(joystickRadius-thumbRadius)/dist;dx*=s;dy*=s;
    }
    thumb.style.transform=`translate(calc(-50%+${dx}px),calc(-50%+${dy}px))`;
    nextDir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
})
document.addEventListener('touchend',()=>{isDragging=false;thumb.style.transform='translate(-50%,-50%)';})

speedBtn.addEventListener('touchstart',()=>{
    if(speedBoosting)return;speedBoosting=true;
    setTimeout(()=>speedBoosting=false,3000);
})

document.addEventListener('keydown',e=>{
    switch(e.key){
        case 'ArrowUp':nextDir='up';break;case 'ArrowDown':nextDir='down';break;
        case 'ArrowLeft':nextDir='left';break;case 'ArrowRight':nextDir='right';break;
        case ' ':killAiGetPoint();break;
    }
})

function buyProp(type){
    if(type==='shield'&&gamePoint>=10){
        gamePoint-=10;shieldTime=5;pointDom.innerText=gamePoint;gamePointDom.innerText=gamePoint;updatePropUI();alert("护盾已激活");
    }else if(type==='lucky'&&gamePoint>=15){
        gamePoint-=15;luckyBuff=true;pointDom.innerText=gamePoint;gamePointDom.innerText=gamePoint;updatePropUI();alert("幸运药水生效");
    }else alert("积分不足");
}

function buySkin(){
    if(gamePoint>=30){
        gamePoint-=30;skinUnlocked=true;currentSkin='maid';pointDom.innerText=gamePoint;gamePointDom.innerText=gamePoint;
        skinStatusDom.innerText="皮肤状态：已解锁（女仆爱丽丝）";alert("购买成功");
    }else alert("积分不足，需要30积分");
}

function closeSkinPanel(){skinUnlockPanel.style.display='none';}

function startChallengeCountdown(){
    challengeTimer=setInterval(()=>{
        challengeTime--;timeLeftDom.innerText=challengeTime;
        if(challengeTime<=0){
            clearInterval(challengeTimer);clearInterval(timer);clearInterval(speedTimer);
            if(gamePoint<50)alert("挑战失败");gameOver();
        }
    },1000);
}

function gameLoop(){
    let cfg=getDifficultyConfig();
    let speed=cfg.speed*(1-speedFactor);
    if(speedBoosting)speed*=0.85;
    playerMove();aiMove();draw();
    timer=setTimeout(gameLoop,speed);
}

function startGame(type){
    difficulty=type;isChallengeMode=false;
    speedFactor=0;gameRunTime=0;clearInterval(speedTimer);startSpeedTimer();
    countdownDom.style.display='none';mainMenu.style.display='none';gameInfo.style.display='block';
    gameLayout.style.display='flex';gameCanvas.style.display='block';joystick.style.display='block';
    speedBtn.style.display='block';endMenu.style.display='none';deathPanel.style.display='none';
    resetGame();genFood();
    draw();//打开立刻渲染画面，消除黑屏
    gameLoop();
}

function startChallenge(){
    difficulty='normal';isChallengeMode=true;challengeTime=60;
    speedFactor=0;gameRunTime=0;clearInterval(speedTimer);startSpeedTimer();
    timeLeftDom.innerText=60;countdownDom.style.display='block';
    mainMenu.style.display='none';gameInfo.style.display='block';gameLayout.style.display='flex';
    gameCanvas.style.display='block';joystick.style.display='block';speedBtn.style.display='block';
    endMenu.style.display='none';deathPanel.style.display='none';
    resetGame();genFood();startChallengeCountdown();
    draw();
    gameLoop();
}

function resetGame(){
    playerSnake=[{x:10,y:10}];aiSnake=[{x:3,y:3}];
    dir='right';nextDir='right';aiDir='right';
    score=0;gamePoint=0;shieldTime=0;luckyBuff=false;speedBoosting=false;doublePoint=false;worldProps=[];
    scoreDom.innerText=0;gamePointDom.innerText=0;pointDom.innerText=0;updatePropUI();
}

function gameOver(){
    clearTimeout(timer);clearInterval(challengeTimer);clearInterval(speedTimer);
    gameCanvas.style.display='none';joystick.style.display='none';speedBtn.style.display='none';
    gameLayout.style.display='none';endMenu.style.display='block';
}

function restartGame(){
    deathPanel.style.display='none';
    speedFactor=0;gameRunTime=0;clearInterval(speedTimer);
    if(isChallengeMode) startChallenge();
    else startGame(difficulty);
}

function backToMenu(){
    deathPanel.style.display='none';
    clearTimeout(timer);clearInterval(challengeTimer);clearInterval(speedTimer);
    gameLayout.style.display='none';gameCanvas.style.display='none';
    joystick.style.display='none';speedBtn.style.display='none';
    mainMenu.style.display='block';gameInfo.style.display='none';endMenu.style.display='none';
}
</script>
</body>
</html>
