<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>简易贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;color:#fff;text-align:center;padding-top:30px;font-family:微软雅黑}
#game{border:2px solid #4CAF50;background:#000;margin:0 auto}
.info{margin-bottom:10px;font-size:18px}
</style>
</head>
<body>
<div class="info">分数：<span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');

// 格子大小
const size = 20;
let snake = [{x:10,y:10}];
let food = {};
let dir = 'right';
let nextDir = 'right';
let score = 0;
let timer;

// 随机生成食物
function genFood(){
    let x,y;
    do{
        x = Math.floor(Math.random()*20);
        y = Math.floor(Math.random()*20);
    }while(snake.some(p=>p.x===x&&p.y===y));
    food = {x,y};
}

// 绘制
function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,400,400);

    // 画蛇
    ctx.fillStyle='#4CAF50';
    snake.forEach(p=>{
        ctx.fillRect(p.x*size,p.y*size,size-1,size-1);
    })

    // 画食物
    ctx.fillStyle='#ff5722';
    ctx.fillRect(food.x*size,food.y*size,size-1,size-1);
}

// 移动
function move(){
    dir = nextDir;
    let head = {...snake[0]};
    switch(dir){
        case 'up': head.y--;break;
        case 'down': head.y++;break;
        case 'left': head.x--;break;
        case 'right': head.x++;break;
    }

    // 撞墙判断
    if(head.x<0||head.x>=20||head.y<0||head.y>=20){
        clearInterval(timer);
        alert('游戏结束！最终分数：'+score);
        return;
    }
    // 撞到自己
    if(snake.some(p=>p.x===head.x&&p.y===head.y)){
        clearInterval(timer);
        alert('游戏结束！最终分数：'+score);
        return;
    }

    snake.unshift(head);

    // 吃到食物
    if(head.x===food.x&&head.y===food.y){
        score++;
        scoreDom.innerText=score;
        genFood();
    }else{
        snake.pop();
    }
}

// 键盘控制
document.addEventListener('keydown',e=>{
    switch(e.key){
        case 'ArrowUp': if(dir!=='down') nextDir='up';break;
        case 'ArrowDown': if(dir!=='up') nextDir='down';break;
        case 'ArrowLeft': if(dir!=='right') nextDir='left';break;
        case 'ArrowRight': if(dir!=='left') nextDir='right';break;
    }
})

// 启动游戏：蛇速度调慢（原150ms改为220ms），食物刷新频率提升25%
genFood();
timer = setInterval(()=>{
    move();
    draw();
},220);
</script>
</body>
</html>
